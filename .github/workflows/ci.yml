name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        id: install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning title=No lockfile::Installing from package.json; commit the generated package-lock.json."
            npm install --no-audit --no-fund
            echo "generated-lockfile=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated lockfile
        if: steps.install.outputs.generated-lockfile == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 7

      # Every check runs even if an earlier one failed, so one CI run reports
      # all problems at once.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Show formatting diff
        if: ${{ failure() && steps.format.outcome == 'failure' }}
        run: npx prettier --write . && git --no-pager diff

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Unit tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage
